name: Publish pub.dev train (waves)

# Single-run, wave-parallel publish of every pending packages/* package.
# Fires automatically on release-please train tags (`intentcall_*-v*`):
# release-please pushes one tag PER package (15 runs fire), and
# `cancel-in-progress: true` makes the NEWEST tag's run the train owner —
# earlier in-flight runs are cancelled cleanly, and `--skip-existing`
# makes every run idempotent (it publishes only what pub.dev lacks).
# Packages publish concurrently within dependency waves (pubspec-computed,
# never hand-maintained); the wave boundary is the dependency wait. No
# per-package dry-run — the PR gate owns the strict preflight — and no
# 300s serial visibility polls, the measured cause of the silent hour.
# Target wall time: ~10 minutes, with per-package progress lines and a
# step-summary table.
#
# pub.dev automated publishing verifies repository + tag pattern + event
# type (tag push only) and does not pin a workflow filename, so this
# workflow is the one authorized publisher. `workflow_dispatch` stays for
# plan-only previews (execute unchecked) and manual recovery;
# dispatch-triggered publishes are not accepted by pub.dev.

on:
  push:
    tags:
      - 'intentcall_*-v*'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Publish for real (unchecked = plan the order only)'
        required: true
        type: boolean
        default: false
      retries:
        description: 'Publish attempts per package'
        required: false
        type: string
        default: '3'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-dev-train
  # The newest tag's run owns the train; superseded runs cancel instead of
  # queueing (cancel-in-progress:false wedged a queued run with zero jobs
  # during the 2026-11-08 GitHub incident and produced the 15-run pileup).
  cancel-in-progress: true

jobs:
  publish-train:
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Workspace dependencies
        run: dart pub get

      - name: Publish train (plan or execute)
        run: >-
          dart run tool/intentcall/bin/intentcall.dart publish-train
          ${{ (github.event_name == 'push' || inputs.execute) && '--execute' || '' }}
          --skip-existing
          --retries "${{ inputs.retries || '3' }}"
