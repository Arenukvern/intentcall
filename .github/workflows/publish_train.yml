name: Publish pub.dev package (per-tag)

# ONE small run PER PACKAGE TAG — the architecture pub.dev itself mandates.
# Verified: "publishing is configured to only be allowed from actions with
# specific ref pattern … Expected tag 'intentcall_bridge-v1.2.0'" — each
# package may only be published from a run whose triggering ref is THAT
# package's own `intentcall_<name>-v<version>` tag. A single consolidated
# train run can therefore only ever publish the one package its tag names
# (measured 2026-11-08: one batch, one package, everything else refused);
# the previous monolithic train design fought this constraint for an hour.
#
# Release-please already pushes one tag per package on the train merge, so
# each tag fires this workflow, and each run publishes exactly its own
# package: static check -> skip if pub.dev has it -> wait (bounded) for
# same-train dependencies to become visible -> publish -> confirm.
# Ordering emerges from the dependency waits; a run whose dependencies are
# not yet visible fails fast and a re-run resumes (skip-existing), so the
# fan-out self-heals. The wave-parallel `publish-train` command remains in
# the CLI for LOCAL publishing (browser auth is not ref-gated).
#
# pub.dev automated publishing verifies repository + tag pattern + event
# type (tag push only); `workflow_dispatch` stays for plan-only previews
# and manual recovery of one package.

on:
  push:
    tags:
      - 'intentcall_*-v*'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Publish for real (unchecked = preflight only)'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Tag to publish (defaults to the dispatching ref)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-package:
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Workspace dependencies
        run: dart pub get

      - name: Publish this tag's package
        env:
          PUB_PUBLISH_WAIT_SECONDS: '240'
        run: >-
          dart run tool/intentcall/bin/intentcall.dart publish-tag
          --tag "${{ inputs.tag || github.ref_name }}"
          ${{ (github.event_name == 'push' || inputs.execute) && '--execute' || '' }}
          --skip-existing
