name: Publish pub.dev train (ordered)

# Single-run, dependency-ordered publish of every pending packages/* package.
# Fires automatically on release-please train tags (`intentcall_*-v*`): each
# run publishes every pending version in pubspec-computed order (the federated
# tail — platform_apple / platform_android — before intentcall_platform),
# retries each package, and skips versions pub.dev already exposes, so re-runs
# resume. One ordered train beats a dozen racing per-tag runs.
#
# pub.dev automated publishing verifies repository + tag pattern + event type
# (tag push only) and does not pin a workflow filename, so this workflow is
# the one authorized publisher. `workflow_dispatch` stays for plan-only
# previews (execute unchecked) and manual recovery; dispatch-triggered
# publishes are not accepted by pub.dev.

on:
  push:
    tags:
      - 'intentcall_*-v*'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Publish for real (unchecked = plan the order only)'
        required: true
        type: boolean
        default: false
      retries:
        description: 'Publish attempts per package'
        required: false
        type: string
        default: '3'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pub-dev-train
  cancel-in-progress: false

jobs:
  publish-train:
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Workspace dependencies
        run: dart pub get

      - name: Publish train (plan or execute)
        run: >-
          dart run tool/intentcall/bin/intentcall.dart publish-train
          ${{ (github.event_name == 'push' || inputs.execute) && '--execute' || '' }}
          --skip-existing
          --retries "${{ inputs.retries || '3' }}"
